name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baitway_admin
          POSTGRES_PASSWORD: baitway_password
          POSTGRES_DB: baitway
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://baitway_admin:baitway_password@localhost:5433/baitway
      TEST_DATABASE_URL: postgresql://baitway_admin:baitway_password@localhost:5433/baitway_test
      # Cle jetable : le code refuse desormais toute valeur d'exemple.
      JWT_SECRET: ci-only-not-a-real-secret-do-not-reuse

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verifier que les migrations s'appliquent
        # Attrape la regression des tetes multiples : deux branches qui ajoutent
        # chacune une migration laissent "alembic upgrade head" ambigu.
        run: |
          test "$(alembic heads | wc -l)" -eq 1 || (echo "Plusieurs tetes Alembic"; alembic heads; exit 1)
          alembic upgrade head

      - name: Lancer les tests
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
